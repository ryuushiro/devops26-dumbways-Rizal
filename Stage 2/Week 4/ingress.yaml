apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: wayshub-ingress
  namespace: wayshub
  annotations:
    kubernetes.io/ingress.class: nginx
spec:
  rules:
    - host: rizal.kubernetes.studentdumbways.my.id
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend
                port:
                  number: 3000
    - host: api.rizal.kubernetes.studentdumbways.my.id
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: backend
                port:
                  number: 5000
